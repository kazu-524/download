<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>添付ファイル</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <div class="head-text">
      <h1>添付ファイル</h1>
      <div id="page" class="page"></div>
    </div>
    <button id="rescan" type="button" class="ghost" title="画面をもう一度調べる">再スキャン</button>
  </header>

  <div id="notice" class="notice" hidden></div>

  <div class="filters">
    <input id="q" type="search" placeholder="名前・URL で絞り込み" autocomplete="off">
    <div id="cats" class="cats"></div>
  </div>

  <div class="listbar">
    <label class="check"><input type="checkbox" id="all"> すべて選択</label>
    <span id="count" class="count"></span>
    <button id="clear" type="button" class="link" title="このタブで記録した通信を消す">通信の記録を消去</button>
  </div>

  <ul id="list" class="list"></ul>
  <div id="empty" class="empty" hidden></div>

  <footer>
    <div class="folder-row">
      <label class="check"><input type="checkbox" id="useFolder"> フォルダに分けて保存</label>
      <input id="folder" type="text" spellcheck="false" title="{host}=サイト名 {date}=日付 {time}=時刻 {title}=ページ名">
    </div>
    <button id="download" type="button" class="primary" disabled>ダウンロード</button>
  </footer>
  <div id="status" class="status" aria-live="polite"></div>

  <script src="common.js"></script>
  <script src="popup.js"></script>
</body>
</html>
